name: Offline tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install test tools on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes zsh openssl

      - name: Verify executable mode
        run: test -x check_tor.zsh

      - name: Check zsh syntax
        run: |
          for script in check_tor.zsh check_tor_core.zsh check_tor_probe.zsh tests/*.zsh; do
            zsh -n "$script" || exit
          done

      - name: Run offline regression tests
        run: zsh tests/check_tor_test.zsh

      - name: Run offline integration tests
        run: zsh tests/check_tor_integration_test.zsh

      - name: Run offline detailed-measurement tests
        run: |
          python3 -m unittest discover -s tests -p 'test_measurement.py'
          python3 -m unittest discover -s tests -p 'test_transport_review.py'
          python3 -m unittest discover -s tests -p 'test_redirects.py'
          python3 -m unittest discover -s tests -p 'test_retry_after.py'

      - name: Run local TLS tests
        run: python3 -m unittest discover -s tests -p 'test_tls.py'

      - name: Verify Apple Python compatibility
        if: runner.os == 'macOS'
        run: |
          /usr/bin/python3 --version
          /usr/bin/python3 -m unittest discover -s tests -p '*test*.py'
