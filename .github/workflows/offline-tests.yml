name: Offline tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      # This must precede checkout: runner-image trust affects checkout itself.
      # Do not fetch a replacement bundle using the trust store being repaired.
      - name: Prepare restricted macOS trust before network access
        id: macos-trust
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import ssl

          # Public root DER SHA-256 values from the incident's roots.json.
          # https://emudhra.we-have-a-problem.com/roots.json
          blocked = {
              "86A1ECBA089C4A8D3BBE2734C612BA341D813E043CF9E8A862CD5C57A36BBE6B",
              "D7A7A0FB5D7E2731D771E9484EBCDEF71D5F0C3E0A2948782BC83EE0EA699EF4",
          }
          sources = [
              Path("/etc/ssl/cert.pem"),
              Path("/opt/homebrew/etc/ca-certificates/cert.pem"),
              Path("/usr/local/etc/ca-certificates/cert.pem"),
          ]
          if not sources[0].is_file():
              raise SystemExit("Required Apple CA bundle is missing")
          destination = Path(os.environ["RUNNER_TEMP"]) / "check-tor-trust"
          destination.mkdir(mode=0o700, exist_ok=True)
          capath = destination / "empty-ca-directory"
          capath.mkdir(mode=0o700, exist_ok=True)
          certificates = {}
          removed = set()
          for source in sources:
              if not source.is_file():
                  continue
              contents = source.read_text()
              blocks = re.findall(r"-----BEGIN CERTIFICATE-----.*?-----END CERTIFICATE-----", contents, re.S)
              if (contents.count("-----BEGIN CERTIFICATE-----") != len(blocks)
                      or contents.count("-----END CERTIFICATE-----") != len(blocks)):
                  raise SystemExit(f"Incomplete certificate block in {source}")
              if not blocks:
                  raise SystemExit(f"No certificates in {source}")
              for pem in blocks:
                  der = base64.b64decode("".join(pem.splitlines()[1:-1]), validate=True)
                  fingerprint = hashlib.sha256(der).hexdigest().upper()
                  if fingerprint in blocked:
                      removed.add(fingerprint)
                  else:
                      certificates[fingerprint] = pem + "\n"
          if not certificates:
              raise SystemExit("Refusing an empty CA bundle")
          retained = "".join(certificates.values())
          # Parse retained roots without loading defaults or making connections.
          ssl.SSLContext(ssl.PROTOCOL_TLS_CLIENT).load_verify_locations(cadata=retained)
          bundle = destination / "cert.pem"
          bundle.write_text(retained)
          # Checkout's Node runtime must select the filtered store. An extra
          # CA bundle would add roots without replacing its built-in trust.
          settings = {
              "SSL_CERT_FILE": str(bundle),
              "SSL_CERT_DIR": str(capath),
              "GIT_SSL_CAINFO": str(bundle),
              "GIT_SSL_CAPATH": str(capath),
              "NODE_OPTIONS": "--use-openssl-ca",
          }
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as output:
              output.write(f"checkout_env={json.dumps(settings)}\n")
          print(f"Restricted CA bundle: {len(certificates)} retained, {len(removed)} affected roots removed")
          PY

      - name: Verify macOS trust before checkout
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/curl -q --silent --show-error --fail --output /dev/null \
            --connect-timeout 10 --max-time 20 https://github.com/
          for host in \
            dv-g3b-emudhra.we-have-a-problem.com \
            dv-g3b-aaa-emudhra.we-have-a-problem.com \
            dv-g3b-noct-emudhra.we-have-a-problem.com \
            dv-g3b-aaa-noct-emudhra.we-have-a-problem.com; do
            curl_rc=0
            /usr/bin/curl -q --silent --show-error --output /dev/null \
              --connect-timeout 10 --max-time 20 "https://$host/" 2>/dev/null || curl_rc=$?
            if [[ "$curl_rc" != 60 ]]; then
              echo "::error::Trust control $host returned curl $curl_rc; expected certificate rejection (60)."
              exit 1
            fi
          done

      - name: Verify checkout Git trust before checkout
        if: runner.os == 'macOS'
        env: ${{ fromJSON(runner.os != 'macOS' && '{}' || steps.macos-trust.outputs.checkout_env) }}
        shell: bash
        run: |
          python3 - <<'PYGITTRUST'
          import os
          import re
          import shutil
          import subprocess
          import tempfile

          HOSTS = (
              "dv-g3b-emudhra.we-have-a-problem.com",
              "dv-g3b-aaa-emudhra.we-have-a-problem.com",
              "dv-g3b-noct-emudhra.we-have-a-problem.com",
              "dv-g3b-aaa-noct-emudhra.we-have-a-problem.com",
          )

          def main():
              # Resolve the same PATH Git as checkout, including Homebrew Git.
              git = shutil.which("git")
              if not git:
                  raise SystemExit("Checkout Git is unavailable; trust is unproven")
              with tempfile.TemporaryDirectory(prefix="check-tor-git-trust-") as directory:
                  # An empty working directory/home plus an allowlisted environment
                  # prevents local/global configs, netrc, askpass, headers, URL
                  # rewrites and proxy credentials from reaching the test hosts.
                  env = {key: os.environ[key] for key in (
                      "PATH", "GIT_SSL_CAINFO", "GIT_SSL_CAPATH", "SSL_CERT_FILE", "SSL_CERT_DIR"
                  ) if key in os.environ}
                  env.update({
                      "HOME": directory, "LC_ALL": "C", "GIT_TERMINAL_PROMPT": "0",
                      "GIT_CONFIG_NOSYSTEM": "1", "GIT_CONFIG_SYSTEM": "/dev/null",
                      "GIT_CONFIG_GLOBAL": "/dev/null", "GIT_CONFIG_COUNT": "0",
                      "GIT_ASKPASS": "/usr/bin/false", "SSH_ASKPASS": "/usr/bin/false",
                  })
                  command = [git, "-c", "credential.helper=", "-c", "credential.interactive=false",
                             "-c", "http.extraHeader=", "-c", "http.proxy=", "-c", "http.sslVerify=true",
                             "-c", "http.followRedirects=false", "-c", "http.lowSpeedLimit=1",
                             "-c", "http.lowSpeedTime=20", "ls-remote"]
                  controls = [("https://github.com/git/git.git", False)]
                  controls.extend((f"https://{host}/check.git", True) for host in HOSTS)
                  for remote, rejected in controls:
                      try:
                          result = subprocess.run(command + [remote, "HEAD"], cwd=directory, env=env,
                                                  capture_output=True, text=True, timeout=30)
                      except subprocess.TimeoutExpired:
                          raise SystemExit(f"Git trust control timed out: {remote}")
                      if rejected:
                          # Git uses 128 for DNS, HTTP and authentication failures
                          # too. Require a certificate-specific diagnostic as well.
                          # Newer libcurl reports OpenSSL verification results numerically;
                          # only a nonzero verification result establishes rejection.
                          valid = result.returncode == 128 and re.search(
                              rf"^fatal: unable to access ['\"]{re.escape(remote)}/?['\"]: "
                              r"(?:SSL certificate problem:|certificate verify failed|server certificate verification failed|SSL peer certificate|"
                              r"SSL certificate OpenSSL verify result: [^\r\n]+ \([1-9][0-9]*\)\r?\n?\Z)",
                              result.stderr, re.I | re.M)
                      else:
                          valid = result.returncode == 0
                      if not valid:
                          # Fixed public controls use an isolated, credential-free environment.
                          # Bound and escape diagnostics so failures remain actionable.
                          print(f"Git control diagnostic: {ascii(result.stderr[:1000])}")
                          raise SystemExit(f"Git trust control failed: {remote} exit {result.returncode}; "
                                           + ("expected certificate rejection" if rejected else "positive control failed"))
              print(f"Checkout Git trust controls passed: {git}; GitHub reachable; all four affected chains rejected")

          if __name__ == "__main__":
              main()
          PYGITTRUST

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        env: ${{ fromJSON(runner.os != 'macOS' && '{}' || steps.macos-trust.outputs.checkout_env) }}
        with:
          persist-credentials: false

      - name: Install zsh on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes zsh

      - name: Verify effective measurement curl trust
        run: zsh scripts/check-curl-trust.zsh

      - name: Verify executable mode
        run: test -x check_tor.zsh

      - name: Check zsh syntax
        run: zsh -n check_tor.zsh check_tor_core.zsh check_tor_probe.zsh scripts/*.zsh tests/*.zsh

      - name: Run offline regression tests
        run: zsh tests/check_tor_test.zsh

      - name: Run offline integration tests
        run: zsh tests/check_tor_integration_test.zsh

      - name: Run offline detailed-measurement tests
        run: |
          python3 -m unittest discover -s tests -p 'test_measurement.py'
          python3 -m unittest discover -s tests -p 'test_transport_review.py'

      - name: Run offline trust-control tests
        run: |
          python3 -m unittest discover -s tests -p 'test_curl_trust.py'
          python3 -m unittest discover -s tests -p 'macos_tls_defaults_test.py'
