# Use instead of routes.conf in a separate, loopback-only nginx instance.
# nginx normalizes paths before location matching. Reject aliases that still
# appear in the original request it received. Query strings are never used by
# the task, and may be present when Cloudflare resumes a challenged navigation.
location = /reading-room {
    if ($request_uri !~ "^/reading-room([?]|$)") { return 404; }
    return 200 '<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reference lab opening hours</title>
<h1>Reference lab opening hours</h1>
<p>The example reading room is open from 9 a.m. to 5 p.m.</p>
<p><a href="/reading-room/complete">Read the visitor information</a></p>
</html>';
}

location = /reading-room/complete {
    if ($request_uri !~ "^/reading-room/complete([?]|$)") { return 404; }
    return 200 '<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visitor information</title>
<h1>Visitor information</h1>
<p>The example reading room is on the ground floor.</p>
</html>';
}

location / {
    return 404;
}
