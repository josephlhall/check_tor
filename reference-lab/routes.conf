# These fixed responses define the reference tasks. No handler reads user input.
location = /normal {
    return 200 '<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reference lab opening hours</title>
<h1>Reference lab opening hours</h1>
<p>The example reading room is open from 9 a.m. to 5 p.m.</p>
<p><a href="/normal/complete">Read the visitor information</a></p>
</html>';
}

location = /normal/complete {
    return 200 '<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visitor information</title>
<h1>Visitor information</h1>
<p>The example reading room is on the ground floor.</p>
</html>';
}

location = /accepted {
    return 202 '<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Example request accepted</title>
<h1>Example request accepted</h1>
<p>This example shows a request that was accepted and is pending. You can close this page.</p>
</html>';
}

location / {
    return 404;
}
