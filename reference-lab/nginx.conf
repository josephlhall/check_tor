# Run with an isolated -p prefix containing routes.conf and a certificate pair.
worker_processes 1;
pid nginx.pid;
error_log /dev/null emerg;

events {
    worker_connections 64;
}

http {
    access_log off;
    server_tokens off;

    client_header_buffer_size 1k;
    large_client_header_buffers 2 4k;
    client_header_timeout 5s;
    client_max_body_size 1k;
    client_body_timeout 5s;
    keepalive_timeout 0;
    send_timeout 5s;
    lingering_time 5s;
    lingering_timeout 2s;

    # Keep runtime files inside the isolated prefix even on packaged nginx.
    client_body_temp_path client_body_temp;
    proxy_temp_path proxy_temp;
    fastcgi_temp_path fastcgi_temp;
    uwsgi_temp_path uwsgi_temp;
    scgi_temp_path scgi_temp;

    map $status $allow_methods {
        405 "GET, HEAD";
        default "";
    }

    server {
        listen 127.0.0.1:18443 ssl;
        server_name localhost;

        ssl_certificate tls.crt;
        ssl_certificate_key tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache off;
        ssl_session_tickets off;

        default_type text/html;
        charset utf-8;
        add_header Allow $allow_methods always;
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy "default-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;

        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        if ($content_length !~ ^0?$) { return 400; }
        if ($http_transfer_encoding != "") { return 400; }

        include routes.conf;
    }
}
